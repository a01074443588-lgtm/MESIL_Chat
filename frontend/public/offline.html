<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f5c56" />
    <title>MESIL_Chat - 연결 없음</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f4f7f6; color: #18312f; font-family: system-ui, sans-serif; }
      main { max-width: 420px; padding: 36px 28px; border-radius: 22px; background: white; box-shadow: 0 18px 60px rgba(23, 72, 67, .12); text-align: center; }
      img { display: block; width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; object-fit: cover; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #617471; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/mesil-chat-192-v3.png" alt="실버메디컬복지센터" />
      <h1>서버에 연결할 수 없습니다.</h1>
      <p>메인 컴퓨터와 네트워크 연결을 확인한 뒤 다시 열어 주세요. 오프라인 상태에서는 새 메시지를 작성할 수 없습니다.</p>
    </main>
  </body>
</html>
