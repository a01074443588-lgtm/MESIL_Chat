[project]
name = "smcodi-chat-backend"
version = "0.1.0"
description = "SilverMedical internal staff chat backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
    "pillow>=11,<12",
    "pywebpush>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
